<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="A playable, accessible, responsive tic-tac-toe game built with vanilla HTML, CSS, and JavaScript." />
  <title>Tic-Tac-Toe</title>
  <!-- Content Security Policy: the app loads nothing but its own two local
       assets and makes no network requests, so everything else is denied. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'" />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f172a'/%3E%3Cpath d='M6 6l10 10M16 6L6 16' stroke='%2360a5fa' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='22' r='5.5' fill='none' stroke='%23f472b6' stroke-width='3'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="app">
    <h1 class="app__title">Tic-Tac-Toe</h1>

    <section class="controls" aria-label="Game settings">
      <div class="control">
        <label for="mode-select">Mode</label>
        <select id="mode-select" data-control="mode">
          <option value="pvp" selected>Player (X) vs. Player (O)</option>
          <option value="pvc">Player (X) vs. Computer (O)</option>
        </select>
      </div>

      <div class="control control--difficulty control--hidden" id="difficulty-control">
        <label for="difficulty-select">Difficulty</label>
        <select id="difficulty-select" data-control="difficulty">
          <option value="easy" selected>Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <p class="mode-indicator" id="mode-indicator" aria-live="off">
        Current mode: <strong data-mode-label>Player (X) vs. Player (O)</strong>
      </p>
    </section>

    <p class="status" id="status" role="status" aria-live="polite">
      Player X's turn
    </p>

    <div class="board" id="board" role="group" aria-label="Tic-tac-toe board">
      <!-- Cells are generated by app.js to keep markup in sync with state. -->
    </div>

    <div class="actions">
      <button type="button" id="reset-btn" data-action="reset">New game</button>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>

</html>
